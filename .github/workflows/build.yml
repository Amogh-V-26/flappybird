name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Setup Android SDK
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk

          mkdir -p $SDK

          cp -r /usr/local/lib/android/sdk/cmdline-tools $SDK/

          mkdir -p $SDK/tools/bin

          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager \
            $SDK/tools/bin/sdkmanager

          ln -sf $SDK/cmdline-tools/latest/bin/avdmanager \
            $SDK/tools/bin/avdmanager

          export PATH=$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          ls -R $SDK/build-tools

      - name: Set Android variables
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappybird-apk
          path: bin/*.apk
